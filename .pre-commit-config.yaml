# Install once per clone: `make setup` (runs `pre-commit install`).
# These hooks scan STAGED content before every commit. They are a fast local
# safety net, not the enforcement layer — CI re-checks everything.
repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged)
        entry: scripts/scan-staged.sh
        language: script
        pass_filenames: false
      - id: public-vocabulary
        name: public vocabulary guard (staged)
        entry: python3 scripts/check_public_vocabulary.py --staged
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
