[project]
name = "text-to-sql-recipe"
version = "0.1.0.dev0"
description = "Reinforcement-learning recipe that teaches language models multi-turn text-to-SQL on River"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# 0.14.1 is the first river-client release that renders Nemotron 3.5 Super VL. The recipe's other needs date from 0.13:
# Trajectory.loss_mask_end, RolloutEngine.resubmit, AsyncTrainer(dataset_scheduler=...) and the trainer's stop on a
# non-finite optimizer step, and `train` names any of those that are missing before it starts.
dependencies = ["river-client>=0.14.1"]

[project.optional-dependencies]
# Everything the full test suite uses: hatchling builds the release artifacts the tests scan; sqlglot runs the
# counterexample-gate tests.
test = ["pytest>=8", "hatchling", "sqlglot==28.0.0"]
# The VeriEQL counterexample gate reads each query's tables with sqlglot. VeriEQL itself is licensed separately
# (CC BY-NC-SA 4.0) and installed by the user; see text_to_sql_recipe/verifier.py.
verieql = ["sqlglot==28.0.0"]
# `setup data` downloads the data release from Hugging Face.
data = ["huggingface_hub>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_recipe"]  # the presets in text_to_sql_recipe/recipes/ ship with it

[tool.hatch.build.targets.sdist]
# An allowlist: nothing outside these paths is published.
only-include = ["src", "tests", "docs", "README.md", "LICENSE", "Dockerfile", ".dockerignore", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
